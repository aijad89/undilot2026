<text x="1309" y="152.5" class="t" fill="#3730a3">Start Polling</text>
<text x="1309" y="172.5" class="s">butang HQ, atau auto</text>
<text x="1309" y="189.5" class="s">pada polling_start_date</text>
<rect x="1430" y="621.5" width="168" height="104" rx="12" fill="#fff" stroke="#9d174d" stroke-width="2"/>
<circle cx="1434" cy="625.5" r="14" fill="#9d174d"/><text x="1434" y="630.5" class="num">8</text>
