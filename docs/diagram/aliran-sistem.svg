<text x="284" y="172.5" class="s">kod kraf, hierarki,</text>
<text x="284" y="189.5" class="s">zon, gaya pendedahan,</text>
<text x="284" y="206.5" class="s">akaun admin</text>
<rect x="405" y="291.5" width="168" height="104" rx="12" fill="#fff" stroke="#065f46" stroke-width="2"/>
<circle cx="409" cy="295.5" r="14" fill="#065f46"/><text x="409" y="300.5" class="num">2</text>
<text x="489" y="317.5" class="t" fill="#065f46">Cipta syarikat</text>
<text x="489" y="337.5" class="s">+ akaun peserta</text>
<text x="489" y="354.5" class="s">(tiada daftar sendiri)</text>
<rect x="405" y="126.5" width="168" height="104" rx="12" fill="#fff" stroke="#3730a3" stroke-width="2"/>
<circle cx="409" cy="130.5" r="14" fill="#3730a3"/><text x="409" y="135.5" class="num">3</text>
