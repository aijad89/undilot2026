<text x="1514" y="667.5" class="s">log masuk → halaman lot</text>
<text x="1514" y="684.5" class="s">→ tanda setuju →</text>
<text x="1514" y="701.5" class="s">Confirm (sekali)</text>
<rect x="1430" y="456.5" width="168" height="104" rx="12" fill="#fff" stroke="#9a3412" stroke-width="2"/>
<text x="1514" y="482.5" class="t" fill="#9a3412">LotAllocator</text>
<text x="1514" y="502.5" class="s">pilih lot ikut kod</text>
<text x="1514" y="519.5" class="s">kraf + saiz gerai</text>
<text x="1514" y="536.5" class="s">(dikunci baris)</text>
<rect x="1635" y="621.5" width="168" height="104" rx="12" fill="#fff" stroke="#9d174d" stroke-width="2"/>
<circle cx="1639" cy="625.5" r="14" fill="#9d174d"/><text x="1639" y="630.5" class="num">9</text>
<text x="1719" y="647.5" class="t" fill="#9d174d">Pendedahan</text>
<text x="1719" y="667.5" class="s">split-flap / sampul</text>
<text x="1719" y="684.5" class="s">→ butiran lot, QR</text>
<text x="1719" y="701.5" class="s">daftar masuk, slip PDF</text>
<rect x="1635" y="456.5" width="168" height="104" rx="12" fill="#fff" stroke="#9a3412" stroke-width="2"/>
<text x="1719" y="482.5" class="t" fill="#9a3412">Peringatan</text>
<text x="1719" y="502.5" class="s">~30 min sebelum tutup</text>
<text x="1719" y="519.5" class="s">kepada yang belum</text>
<text x="1719" y="536.5" class="s">undi (sekali)</text>
<rect x="1840" y="456.5" width="168" height="104" rx="12" fill="#fff" stroke="#9a3412" stroke-width="2"/>
<circle cx="1844" cy="460.5" r="14" fill="#9a3412"/><text x="1844" y="465.5" class="num">10</text>
<text x="1924" y="482.5" class="t" fill="#9a3412">Tutup cabutan</text>
<text x="1924" y="502.5" class="s">manual, atau auto</text>
<text x="1924" y="519.5" class="s">pada polling_deadline</text>
<rect x="1840" y="126.5" width="168" height="104" rx="12" fill="#fff" stroke="#3730a3" stroke-width="2"/>
<circle cx="1844" cy="130.5" r="14" fill="#3730a3"/><text x="1844" y="135.5" class="num">11</text>
<text x="1924" y="152.5" class="t" fill="#3730a3">Agih baki lot</text>
<text x="1924" y="172.5" class="s">untuk yang belum undi;</text>
<text x="1924" y="189.5" class="s">tak muat → set aside</text>
<text x="1924" y="206.5" class="s">manual, ulang</text>
