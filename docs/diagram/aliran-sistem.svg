<rect width="2180" height="950" fill="#ffffff"/>
<text x="40" y="50" class="h1">Aliran Sistem undilot2026</text>
<text x="40" y="78" class="h2">Cabutan lot acara kraf Kraftangan Malaysia — dari persediaan hingga slip lot peserta</text>
<rect x="20" y="96" width="2140" height="159" rx="14" fill="#eef2ff"/>
<text x="40" y="174.5" class="lane" fill="#3730a3">Super / HQ</text>
<text x="40" y="194.5" class="lanesub">admin pusat</text>
<rect x="20" y="261" width="2140" height="159" rx="14" fill="#ecfdf5"/>
<text x="40" y="339.5" class="lane" fill="#065f46">Admin negeri</text>
<text x="40" y="359.5" class="lanesub">ikut zon</text>
<rect x="20" y="426" width="2140" height="159" rx="14" fill="#fff7ed"/>
<text x="40" y="504.5" class="lane" fill="#9a3412">Sistem</text>
<text x="40" y="524.5" class="lanesub">penjadual + peraturan</text>
<rect x="20" y="591" width="2140" height="159" rx="14" fill="#fdf2f8"/>
<text x="40" y="669.5" class="lane" fill="#9d174d">Peserta</text>
<text x="40" y="689.5" class="lanesub">usahawan, di telefon</text>
