<text x="489" y="172.5" class="s">tarikh, tetingkap</text>
<text x="489" y="189.5" class="s">pendaftaran, banner</text>
<rect x="610" y="291.5" width="168" height="104" rx="12" fill="#fff" stroke="#065f46" stroke-width="2"/>
<circle cx="614" cy="295.5" r="14" fill="#065f46"/><text x="614" y="300.5" class="num">4</text>
