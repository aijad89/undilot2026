<text x="694" y="337.5" class="s">kod kraf, saiz gerai,</text>
<text x="694" y="354.5" class="s">nota bayaran</text>
<text x="694" y="371.5" class="s">→ menunggu HQ</text>
<rect x="815" y="126.5" width="168" height="104" rx="12" fill="#fff" stroke="#3730a3" stroke-width="2"/>
<circle cx="819" cy="130.5" r="14" fill="#3730a3"/><text x="819" y="135.5" class="num">5</text>
